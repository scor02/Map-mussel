<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mussel Sampling Map</title>

  <style>
    :root {
      --bg: #0f1724;
      --accent3: #3fb4ff;
      --muted: #9aa7c7;
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #071026 0%, #071b2a 60%);
      font-family: Inter, ui-sans-serif, system-ui, Arial;
      color: var(--muted);
    }

    .container {
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      height: 100%;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    h1 {
      margin: 0 0 10px;
      color: white;
      font-size: 1.3rem;
    }

    #mapContainer {
      height: calc(100% - 60px);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }

    /* Fade animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .fade-in { animation: fadeIn 1s ease forwards; }

    #mapLoading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Mussel Sampling Map</h1>

      <div id="mapContainer">
        <span id="mapLoading">Loading map…</span>
      </div>
    </div>
  </div>

  <script>
    /**************************************************************
     * Load the R Leaflet map inside the container
     **************************************************************/
    const container = document.getElementById('mapContainer');
    const iframe = document.createElement('iframe');

    iframe.src = "map/index.html";   // Your map file
    iframe.style.border = "none";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.opacity = "0";

    iframe.onload = () => {
      document.getElementById("mapLoading").remove();
      iframe.classList.add("fade-in");
    };

    container.appendChild(iframe);
  </script>
</body>
</html>
