<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    :root {
      --bg: #0f1724;
      --accent3: #3fb4ff;
      --muted: #9aa7c7;
      color-scheme: dark;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #071026 0%, #071b2a 60%);
      font-family: Inter, ui-sans-serif, system-ui, Arial;
      color: var(--muted);
    }

    .container {
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      height: 100%;
      background: rgba(255,255,255,0.03);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    h1 {
      margin: 0 0 10px;
      color: white;
      font-size: 1.3rem;
    }

    /* ===========================
   MAP LEGEND STYLES
   =========================== */
#legend {
  position: absolute;
  top: 70px;               /* adjust downward from the header */
  right: 25px;              /* distance from left side */
  background: rgba(0,0,0,0.45);
  padding: 10px 14px;
  border-radius: 8px;
  color: white;
  font-size: 0.9rem;
  line-height: 1.4rem;
  z-index: 9999;           /* make sure it's above the map */
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.15);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-color {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  display: inline-block;
}

.legend-color.blue { background: #3fb4ff; }  /* Blue = m-orf */
.legend-color.red  { background: #ff4b4b; }  /* Red = f-orf */

    #mapContainer {
      height: calc(100% - 60px);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      position: relative;
      overflow: hidden;
    }

    /* Fade animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .fade-in { animation: fadeIn 1s ease forwards; }

    #mapLoading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Mussel Sampling Map</h1>
      <div class="card">
      <h1>Mussel Sampling Map</h1>
    
      <!-- 🌈 LEGEND BOX -->
      <div id="legend">
        <div class="legend-item">
          <span class="legend-color blue"></span> Blue = m-orf
        </div>
        <div class="legend-item">
          <span class="legend-color red"></span> Red = f-orf
        </div>
      </div>
    
      <div id="mapContainer">

        <span id="mapLoading">Loading map…</span>
      </div>
    </div>
  </div>

  <script>
    /**************************************************************
     * Load the R Leaflet map inside the container
     **************************************************************/
    const container = document.getElementById('mapContainer');
    const iframe = document.createElement('iframe');

    iframe.src = "map/index.html";   // Your map file
    iframe.style.border = "none";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.opacity = "0";

    iframe.onload = () => {
      document.getElementById("mapLoading").remove();
      iframe.classList.add("fade-in");
    };

    container.appendChild(iframe);
  </script>
</body>
</html>
